[package]
name = "stackspine"
version = "1.0.0"
edition = "2021"
authors = ["StackSpine <support@stackspine.com>"]
description = "Official Rust SDK for the StackSpine multi-model AI control plane"
license = "MIT"
repository = "https://github.com/stackspine/sdk-rust"
homepage = "https://stackspine.com"
documentation = "https://docs.stackspine.com"
keywords = ["ai", "llm", "api", "routing", "multi-model"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
futures = "0.3"
pin-project-lite = "0.2"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
