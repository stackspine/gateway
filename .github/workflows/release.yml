name: Release & Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  disclosure-scan:
    name: Pre-release disclosure scan
    uses: ./.github/workflows/scan-disclosure.yml

  release-notes:
    name: Generate release notes
    needs: disclosure-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version + changelog section
        id: notes
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION_NUM="${VERSION#v}"
          # Pull the matching ## [X.Y.Z] section out of CHANGELOG.md
          awk -v v="${VERSION_NUM}" '
            $0 ~ "^## \\[" v "\\]" {flag=1; print; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "## Compatibility"
            echo ""
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| Docker image | \`ghcr.io/stackspine/gateway:${VERSION_NUM}\` |"
            echo "| Helm chart   | \`oci://ghcr.io/stackspine/charts/stackspine:${VERSION_NUM}\` |"
            echo "| DB schema    | \`migrations/000_core_schema.sql\` @ ${VERSION_NUM} |"
            echo "| SDK range    | \`>=${VERSION_NUM%%.*}.0.0 <$((${VERSION_NUM%%.*}+1)).0.0\` |"
            echo ""
            echo "See [deploy/SELF-HOST.md](./deploy/SELF-HOST.md#compatibility-matrix) for the full matrix."
          } >> release-notes.md
      - name: Update GitHub release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.event.release.tag_name }}" --notes-file release-notes.md

  publish-npm:
    name: Publish — npm
    needs: disclosure-scan

    name: Publish — npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Set version from tag
        run: npm version "${{ github.event.release.tag_name }}" --no-git-tag-version --allow-same-version
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish — PyPI
    needs: disclosure-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Set version from tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
      - name: Build package
        run: python -m build
      - name: Upload to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-crates:
    name: Publish — crates.io
    needs: disclosure-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version from tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
      - name: Publish
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-rubygems:
    name: Publish — RubyGems
    needs: disclosure-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Set version from tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/VERSION = .*/VERSION = \"${VERSION}\"/" lib/stackspine/version.rb
      - name: Build gem
        run: gem build stackspine.gemspec
      - name: Push gem
        run: gem push stackspine-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}

  publish-docker:
    name: Publish — Docker (GHCR)
    needs: disclosure-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/stackspine/gateway:${{ steps.version.outputs.version }}
            ghcr.io/stackspine/gateway:latest

  publish-helm:
    name: Publish — Helm (OCI to GHCR)
    needs: disclosure-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Set chart version + appVersion
        run: |
          V="${{ steps.version.outputs.version }}"
          sed -i "s/^version: .*/version: ${V}/" deploy/helm/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${V}\"/" deploy/helm/Chart.yaml
      - name: Package chart
        run: helm package deploy/helm -d /tmp/chart
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push chart
        run: helm push /tmp/chart/stackspine-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/stackspine/charts

