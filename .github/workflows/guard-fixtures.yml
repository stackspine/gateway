name: Public-Repo-Guard Fixtures

# Validates the public-repo-guard rules against the fixture library so that
# any regression in the rules (or in the fixtures) blocks merging.
#
# pass/<case>/  → guard.sh MUST exit 0
# fail/<case>/  → guard.sh MUST exit 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    name: Run guard fixture library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Show ripgrep version
        run: rg --version
      - name: Resolve OSS root
        id: root
        run: |
          if [ -d gateway-oss ]; then
            echo "root=gateway-oss" >> "$GITHUB_OUTPUT"
          else
            echo "root=." >> "$GITHUB_OUTPUT"
          fi
      - name: Validate fixtures
        working-directory: ${{ steps.root.outputs.root }}
        run: bash scripts/run-guard-fixtures.sh
