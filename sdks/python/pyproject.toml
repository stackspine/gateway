[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackspine"
version = "1.0.0"
description = "Official Python SDK for StackSpine — Multi-Model AI Control Plane"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "StackSpine", email = "support@stackspine.com"},
]
keywords = ["stackspine", "ai", "llm", "openai", "anthropic", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://stackspine.com"
Documentation = "https://docs.stackspine.com/sdk"
Repository = "https://github.com/stackspine/sdk-python"
Changelog = "https://github.com/stackspine/sdk-python/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["stackspine*"]
